<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>my CarrEar · your personal AI team</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Your career now has a team. Seven AI agents for your job search, your growth and your day, inside your own Claude.">
<style>
@font-face{font-family:'Manrope';font-weight:600;font-display:swap;src:url(fonts/manrope-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-weight:700;font-display:swap;src:url(fonts/manrope-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-weight:800;font-display:swap;src:url(fonts/manrope-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:400;font-display:swap;src:url(fonts/instrument-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:500;font-display:swap;src:url(fonts/instrument-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:600;font-display:swap;src:url(fonts/instrument-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Sans';font-weight:700;font-display:swap;src:url(fonts/instrument-sans-latin-700-normal.woff2) format('woff2')}
/* One guided tour. A single cool ground, navy ink, amber only for actions.
   The memorable thing: the seven agents live on a fixed stage and re-arrange themselves for every chapter. */
:root{
  color-scheme:light;
  --mist:#edf0f7; --surface:#ffffff; --tint:#e2e6f2; --line:#d3d9ea;
  --ink:#121a3d; --ink-soft:#4a5378; --mute:#737c9f;
  --amber:#f2a93b; --amber-ink:#2a1a02;
  --display:"Manrope","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --c-nina:#3d6fe8; --c-marco:#d4802f; --c-helena:#8b6cc9; --c-claire:#3f9a74; --c-leo:#4f78c4; --c-maya:#d2653a; --c-ravi:#b8475f;
  --bar:64px; --ease:cubic-bezier(.65,0,.25,1);
}
*{box-sizing:border-box}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.025em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:10px}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* header + progress */
.bar{position:fixed;inset:0 0 auto;z-index:30;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--mist) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bar-in{height:var(--bar);display:flex;align-items:center;gap:20px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}
.mark b{font:800 18px var(--display);letter-spacing:-.02em;white-space:nowrap;display:block}
.mark small{display:block;font:600 11.5px var(--body);color:var(--mute);letter-spacing:.01em}
.mark b i,.hero-brand b i{font-style:normal;font-weight:600;color:var(--mute);margin-right:1px}.mark b em,.hero-brand b em{font-style:normal;color:#d98a12}
.steps-nav{flex:1;display:flex;gap:6px;min-width:0;justify-content:center}
.steps-nav button{border:0;background:none;cursor:pointer;padding:6px 4px 8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:0;flex:1;max-width:120px;color:var(--mute);font:600 12.5px var(--body);text-align:left}
.steps-nav i{display:block;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--amber) var(--p,0%),var(--line) 0)}
.steps-nav button[aria-current="step"]{color:var(--ink)}
.steps-nav span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:10px;flex:none}
.lang{display:flex;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line)}
.lang button{border:0;background:none;cursor:pointer;padding:6px 10px;font:600 12.5px var(--body);color:var(--mute);border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;text-decoration:none;border-radius:999px;padding:14px 24px;font:600 15.5px var(--body);background:var(--amber);color:var(--amber-ink);transition:transform .2s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn.quiet{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:9px 16px;font-size:14px}
@media (max-width:1100px){.steps-nav span{display:none}.steps-nav button{max-width:36px}}
@media (max-width:640px){.bar .btn{display:none}.bar #meetBtn{padding:4px 10px 4px 4px;font-size:13px;gap:7px}.mc-faces img:nth-child(n+3),.mc-play{display:none}.mark small{font-size:10px}.bar-in{gap:12px;position:relative}.steps-nav{position:absolute;left:0;right:0;bottom:0;gap:4px}.steps-nav button{max-width:none;padding:0 0 6px}}

/* fixed stage with the cast */
.stage{position:fixed;z-index:1;top:0;right:0;width:50vw;height:100svh;display:flex;align-items:center;justify-content:center;padding-top:var(--bar);pointer-events:none}
.cast{position:relative;width:min(40vw,74svh);aspect-ratio:1}
.cast::before{content:"";position:absolute;inset:6%;border-radius:50%;border:1.5px dashed var(--line);transition:opacity .8s var(--ease),transform .9s var(--ease)}
.cast .path{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .6s}
.cast[data-ch="3"] .path{opacity:1}
.cast[data-ch="3"]::before,.cast[data-ch="4"]::before,.cast[data-ch="6"]::before{opacity:0;transform:scale(.6)}
.face{position:absolute;left:50%;top:50%;width:19%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;will-change:left,top,transform}
.cast.anim .face{transition:left .7s var(--ease),top .7s var(--ease),transform .7s var(--ease),opacity .5s,filter .5s}
.face .ph{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--tint);box-shadow:0 0 0 3px var(--mist),0 0 0 6px var(--c)}
.face img{width:100%;height:100%;object-fit:cover}
.face b{font:700 clamp(11px,1.05vw,14px) var(--display);white-space:nowrap}
.core{position:absolute;left:50%;top:50%;width:32%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6%;box-shadow:0 0 0 8px color-mix(in srgb,var(--amber) 35%,transparent);transition:transform .9s var(--ease),opacity .6s,width .9s var(--ease)}
.core b{font:800 clamp(18px,2.4vw,34px)/1.05 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.core b.long{font-size:clamp(13px,1.45vw,20px);line-height:1.15}
.core small{font-size:clamp(10px,.95vw,13px);color:#c6cce6;margin-top:4px;line-height:1.25}
.core.off{opacity:0;transform:translate(-50%,-50%) scale(.3)}

/* chapters */
main{position:relative;z-index:2}
.ch{min-height:100svh;height:100svh;scroll-snap-align:start;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-top:var(--bar)}
.panel{display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:24px;max-width:640px;margin-left:auto;width:100%;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:32px}
.ch h1{font-size:clamp(48px,6vw,96px);line-height:.92;letter-spacing:-.035em;font-weight:800}
.ch h2{font-size:clamp(32px,3.6vw,52px);line-height:1.02;font-weight:800}
.lede{font-size:clamp(17px,1.4vw,20px);color:var(--ink-soft);max-width:34em}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.fine{font-size:14px;color:var(--mute)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#c1 .panel > *{animation:rise .9s cubic-bezier(.16,1,.3,1) both}#c1 .panel > :nth-child(2){animation-delay:.08s}#c1 .panel > :nth-child(3){animation-delay:.16s}#c1 .panel > :nth-child(4){animation-delay:.24s}
.cast{animation:pop 1.1s cubic-bezier(.16,1,.3,1) .1s both}


/* hero film */
#c1 .panel{margin-left:0;max-width:600px}
.hero-film{display:flex;align-items:center;justify-content:flex-end;padding:24px clamp(24px,4vw,64px)}
.hf{position:relative;height:min(72svh,740px);aspect-ratio:9/16;border-radius:28px;overflow:hidden;background:#000;box-shadow:0 40px 90px -40px rgba(18,26,61,.6);animation:rise 1s cubic-bezier(.16,1,.3,1) both}
.hf video{display:block;width:100%;height:100%;object-fit:cover}
.hf-play{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;border:0;cursor:pointer;padding:12px 20px 12px 12px;border-radius:999px;background:var(--amber);color:var(--amber-ink);font:600 15px var(--body);white-space:nowrap;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);transition:transform .2s var(--ease)}
.hf-play:hover{transform:translateX(-50%) scale(1.04)}
.hf-play span{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;padding-left:2px}
.stage{transition:opacity .4s}
[hidden]{display:none!important}
.cast[data-ch="1"]::before{opacity:0}

/* ch2 chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;cursor:pointer;padding:10px 16px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font:600 15px var(--body);color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.answer{padding:20px 22px;border-radius:20px;background:var(--surface)}
.answer h3{font-size:21px;margin-bottom:10px}
.answer ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.answer li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;color:var(--ink-soft);font-size:15.5px}
.answer li img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.answer li b{color:var(--ink)}

/* ch3 demo */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:8px;border:0;cursor:pointer;padding:5px 14px 5px 5px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);font:600 14.5px var(--body)}
.tab img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.tab[aria-selected="true"]{background:var(--surface);box-shadow:inset 0 0 0 2px var(--c)}
.screen{border-radius:18px;background:var(--surface);overflow:hidden;box-shadow:0 24px 60px -36px rgba(18,26,61,.45)}
.url{padding:10px 16px;font-size:12.5px;color:var(--mute);border-bottom:1px solid var(--line)}
.pane{padding:6px 18px 14px;min-height:236px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item p{font-size:14.5px}
.item small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.ok{border:0;cursor:pointer;padding:8px 13px;border-radius:999px;background:var(--ink);color:#fff;font:600 12.5px var(--body);white-space:nowrap}
.ok.done{background:var(--tint);color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.day{border-radius:10px;background:var(--mist);padding:8px;min-height:96px;display:flex;flex-direction:column;gap:5px;min-width:0}
.day h4{margin:0;font:700 12px var(--body);color:var(--mute)}
.ev{font-size:12px;line-height:1.25;padding:5px 6px;border-radius:7px;background:var(--surface);overflow-wrap:anywhere}
.ev.warn{box-shadow:inset 0 0 0 1.5px var(--amber)}
.ev.done{box-shadow:inset 0 0 0 1.5px var(--c-claire);background:#e6f4ec;font-weight:600}
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:12px;padding:10px 12px;border-radius:12px;background:#fdf1dd;font-size:14px}
.gantt{display:grid;gap:10px;margin-top:12px}
.g{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
.track{position:relative;height:18px;border-radius:999px;background:var(--mist)}
.track i{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--line)}
.track i.done{background:var(--ink-soft)}
.track i.next{background:var(--amber)}

/* relay */
.relay{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:r}
.relay li{counter-increment:r;display:grid;grid-template-columns:46px minmax(0,1fr);gap:14px;align-items:center;padding:10px 14px;border-radius:16px;background:var(--surface)}
.relay .av{position:relative;width:46px;height:46px}
.relay .av img{width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2.5px var(--c)}
.relay .av::after{content:counter(r);position:absolute;right:-6px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--amber);color:var(--amber-ink);font:800 11px var(--display);display:flex;align-items:center;justify-content:center}
.relay p{font-size:15px;color:var(--ink-soft)}
.relay b{color:var(--ink)}
/* film dialog */
dialog.film{padding:0;border:0;background:#000;border-radius:22px;overflow:visible;max-width:none;max-height:none}
dialog.film::backdrop{background:rgba(12,18,48,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog.film video{display:block;border-radius:22px;height:min(84svh,1100px);width:auto;max-width:92vw;object-fit:contain;background:#000}
dialog.film .m-x{position:absolute;top:-14px;right:-14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.m-film{grid-column:1/-1}
.m-film video{display:block;width:100%;max-height:62svh;border-radius:20px;background:#000}
.m-tab.film{background:var(--ink);color:#fff;box-shadow:none}
.m-tab.film[aria-selected="true"]{background:var(--amber);color:var(--amber-ink)}

/* ch4 comparison */
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:20px;overflow:hidden;background:var(--surface)}
.vs > div{padding:14px 18px;font-size:15px;border-top:1px solid var(--line)}
.vs .h{font:700 14px var(--body);border-top:0;padding-top:16px}
.vs .them{color:var(--mute)}
.vs .us{color:var(--ink);background:color-mix(in srgb,var(--amber) 12%,var(--surface))}
.quote{font:700 clamp(19px,1.7vw,24px)/1.3 var(--display);color:var(--ink);max-width:28em}

/* ch5 steps */
.plan{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.plan li{counter-increment:s;display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;align-items:start;padding:16px 18px;border-radius:18px;background:var(--surface)}
.plan li::before{content:counter(s);width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;font:800 18px var(--display);display:flex;align-items:center;justify-content:center}
.plan b{display:block;font:700 18px var(--display)}
.plan span{color:var(--ink-soft);font-size:15px}

/* ch6 configurator */
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--surface);cursor:pointer;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s}
.opt:has(input:checked){box-shadow:inset 0 0 0 1.5px var(--ink)}
.opt.base{cursor:default}
.opt input{width:20px;height:20px;accent-color:var(--ink);margin:0}
.opt b{display:block;font-size:15.5px}
.opt small{display:block;color:var(--mute);font-size:13.5px;line-height:1.35}
.price{font:800 18px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.sum{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:18px;background:var(--ink);color:#fff}
.sum .t{font:800 30px var(--display);font-variant-numeric:tabular-nums}
.sum small{display:block;color:#c6cce6;font-size:13px}
.proto{padding:12px 14px;border-radius:12px;background:#fdf1dd;font-size:14px}

/* ch7 */
.faq{display:grid;gap:6px}
.faq details{border-radius:14px;background:var(--surface);padding:12px 16px}
.faq summary{cursor:pointer;font-weight:600;font-size:15.5px}
.faq p{margin-top:8px;color:var(--ink-soft);font-size:15px}
footer{font-size:13px;color:var(--mute)}
footer a{color:var(--ink)}

/* meet your agents */

/* meet your agents: header call to action */
.meet-cta{position:relative;display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;padding:5px 8px 5px 5px;border-radius:999px;background:var(--ink);color:#fff;font:700 14px var(--body);white-space:nowrap;box-shadow:0 10px 26px -12px rgba(18,26,61,.7);transition:transform .2s var(--ease)}
.meet-cta::before{content:"";position:absolute;inset:-3px;border-radius:inherit;border:2px solid var(--amber);opacity:0;animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{opacity:.9;transform:scale(.96)}70%,100%{opacity:0;transform:scale(1.12)}}
.meet-cta:hover{transform:translateY(-2px)}
.mc-faces{display:flex}
.mc-faces img{width:28px;height:28px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--ink)}
.mc-faces img+img{margin-left:-9px}
.mc-play{width:26px;height:26px;border-radius:50%;background:var(--amber);color:var(--amber-ink);font-style:normal;font-size:10px;display:flex;align-items:center;justify-content:center;padding-left:2px}
/* big play on photos and the team film */
.m-film{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:16/9;max-height:64svh;margin-inline:auto;width:min(100%,calc(64svh * 16 / 9))}
.m-film img,.m-film video{display:block;width:100%;height:100%;object-fit:cover}
.bigplay{position:absolute;inset:0;border:0;padding:0;cursor:pointer;background:linear-gradient(to top,rgba(12,18,48,.55),transparent 55%);display:flex;align-items:center;justify-content:center}
.bigplay span{width:clamp(64px,8vw,96px);aspect-ratio:1;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,2.4vw,30px);padding-left:5px;box-shadow:0 0 0 10px color-mix(in srgb,var(--amber) 30%,transparent),0 20px 40px -10px rgba(0,0,0,.5);transition:transform .25s var(--ease)}
.bigplay:hover span{transform:scale(1.08)}
.bigplay b{position:absolute;left:24px;bottom:20px;color:#fff;font:800 clamp(18px,2vw,26px) var(--display);letter-spacing:-.02em}
.m-photo{position:relative}
.m-photo video{width:100%;height:100%;object-fit:cover;object-position:var(--op,50%) 50%;background:#000}
.m-photo .bigplay b{font-size:16px;left:18px;bottom:16px}
dialog#meet{width:min(1180px,calc(100vw - 24px));height:min(860px,calc(100svh - 24px));max-width:none;max-height:none;padding:0;border:0;border-radius:28px;background:var(--mist);color:var(--ink);box-shadow:0 40px 120px -40px rgba(18,26,61,.6)}
dialog#meet::backdrop{background:rgba(18,26,61,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog#meet[open]{animation:rise .5s cubic-bezier(.16,1,.3,1)}
.m-in{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.m-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 28px 6px}
.m-top h2{font-size:clamp(26px,2.6vw,38px)}
.m-x{border:0;background:var(--surface);width:44px;height:44px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;flex:none}
.m-tabs{display:flex;gap:8px;padding:10px 28px 18px;overflow-x:auto;scrollbar-width:none}
.m-tabs::-webkit-scrollbar{display:none}
.m-tab{flex:none;display:flex;align-items:center;gap:8px;border:0;cursor:pointer;padding:5px 15px 5px 5px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);font:600 14.5px var(--body)}
.m-tab img{width:34px;height:34px;border-radius:50%;object-fit:cover}

/* cast */
const cast=document.getElementById("cast"),core=document.getElementById("core");
const faces={};
IDS.forEach(id=>{const d=document.createElement("div");d.className="face";d.style.setProperty("--c",`var(--c-${id})`);
  d.innerHTML=`<span class="ph"><img src="${img(id)}" alt=""></span><b>${NAME[id]}</b>`;cast.appendChild(d);faces[id]=d;});
const ORBIT=[[50,10],[85,27],[90,63],[68,90],[32,90],[10,63],[15,27]];
const HEX=IDS.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/7;return[50+Math.cos(a)*30,50+Math.sin(a)*30]});
function pose(ch){const P={};
  IDS.forEach((id,i)=>{let [x,y]=ORBIT[i],s=1,o=1,g=0;
    if(ch===1){x=50;y=50;s=.3;o=0;}
    if(ch===2){const on=t("chips").find(c=>c.k===S.chip).a.includes(id);s=on?1.2:.85;o=on?1:.35;g=on?0:1;}
    if(ch===3){const R={helena:[14,25],nina:[33,57],marco:[52,25],claire:[71,57],leo:[88,25],maya:[40,88],ravi:[60,88]};[x,y]=R[id];if(id==="maya"||id==="ravi"){s=.55;o=.3;g=1;}else s=.92;}
    if(ch===4){const big=["claire","leo","ravi"];if(big.includes(id)){x=[22,50,78][big.indexOf(id)];y=id===S.tab?38:44;s=id===S.tab?1.55:1.1;o=id===S.tab?1:.55;}else{x=[23,41,59,77][["nina","marco","helena","maya"].indexOf(id)];y=84;s=.62;o=.3;g=1;}}
    if(ch===5){[x,y]=HEX[i];s=.9;}
    if(ch===6){x=8+i*14;y=id==="helena"?42:52;s=id==="helena"?1.05:.72;o=id==="helena"?1:.8;}
    if(ch===7){const off=(id==="nina"&&!S.sel.nina)||(id==="marco"&&!S.sel.marco);o=off?.25:1;g=off?1:0;s=off?.85:1;}
    P[id]={x,y,s,o,g};});return P;}
const lerp=(a,b,k)=>a+(b-a)*k,ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const pos={ch:1,t:0};let coreKey="";
function draw(){const A=pose(pos.ch),B=pos.t>0&&pos.ch<8?pose(pos.ch+1):A,k=ease(pos.t);
  IDS.forEach(id=>{const p=A[id],q=B[id],f=faces[id];
    f.style.left=lerp(p.x,q.x,k)+"%";f.style.top=lerp(p.y,q.y,k)+"%";f.style.transform=`translate(-50%,-50%) scale(${lerp(p.s,q.s,k).toFixed(3)})`;
    f.style.opacity=lerp(p.o,q.o,k).toFixed(3);f.style.filter=`grayscale(${lerp(p.g,q.g,k).toFixed(2)})`;});
  const ch=pos.t>.5?Math.min(8,pos.ch+1):pos.ch;cast.dataset.ch=ch;
  const key=ch+L+total();if(key===coreKey)return;coreKey=key;
  const b=core.querySelector("b"),sm=core.querySelector("small");
  core.classList.toggle("off",ch===1||ch===3||ch===4||ch===6);b.classList.toggle("long",ch===5);
  if(ch===5){b.textContent=t("mem");sm.textContent="";}
  else if(ch===7){b.textContent=fmt(total());sm.textContent=t("per");}
  else{b.textContent=t("you");sm.textContent=t("boss");}
}
function refresh(anim){if(anim){cast.classList.add("anim");clearTimeout(refresh.tm);refresh.tm=setTimeout(()=>cast.classList.remove("anim"),750);}coreKey="";draw();}

/* nav + scroll engine: native scroll smoothed by Lenis; the cast morphs continuously between chapters */
const secs=[...document.querySelectorAll(".ch")],nav=document.getElementById("nav");
function renderNav(){nav.innerHTML=t("nav").map((l,i)=>`<button type="button" data-n="${i+1}" aria-label="${esc(l)}"><i></i><span>${esc(l)}</span></button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>jump(+b.dataset.n)));paintNav();}
function paintNav(){const cur=pos.t>.5?pos.ch+1:pos.ch;S.ch=cur;document.documentElement.classList.toggle("at-hero",cur===1);if(cur!==1){const hv=document.getElementById("heroV");if(hv&&!hv.paused)hv.pause();}
  nav.querySelectorAll("button").forEach((b,i)=>{const n=i+1,p=n<=pos.ch?100:n===pos.ch+1?Math.round(pos.t*100):0;
    b.querySelector("i").style.setProperty("--p",p+"%");if(n===cur)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current");});}
let tops=[];function measure(){tops=secs.map(s=>s.offsetTop);}
function update(){const y=scrollY,a=y+innerHeight*.5;let k=0;tops.forEach((tp,i)=>{if(tp<=a)k=i;});
  const top=tops[k],next=k+1<tops.length?tops[k+1]:top+secs[k].offsetHeight,f=(a-top)/Math.max(1,next-top);
  pos.ch=k+1;pos.t=k+1<secs.length?Math.min(1,Math.max(0,(f-.55)/.45)):0;draw();paintNav();}
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;let lenis=null;
if(!calm&&window.Lenis){lenis=new Lenis({lerp:.085,wheelMultiplier:.9});const loop=tm=>{lenis.raf(tm);requestAnimationFrame(loop)};requestAnimationFrame(loop);}
addEventListener("scroll",update,{passive:true});
addEventListener("resize",()=>{measure();update();});
function jump(n){const el=document.getElementById("c"+n);if(lenis)lenis.scrollTo(el,{duration:1.4});else el.scrollIntoView({behavior:calm?"auto":"smooth"});}
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#c"]');if(a){e.preventDefault();jump(+a.getAttribute("href").slice(2));}});

  el.innerHTML=`<span class="sn">${String(n).padStart(2,"0")}</span><span class="sl">${esc(t("nav")[n-1])}</span><span class="ln"><b></b></span><span class="dots">${IDS.map(id=>`<i style="--c:var(--c-${id})"></i>`).join("")}</span>`;
  el.querySelectorAll(".dots i").forEach((d,k)=>d.style.transitionDelay=(0.9+k*.07)+"s");});}
if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("seen");io.unobserve(e.target);}}),{threshold:.35});secs.forEach(s=>io.observe(s));}else secs.forEach(s=>s.classList.add("seen"));

/* ch2 */
function renderChips(){const box=document.getElementById("chips");box.setAttribute("aria-label",t("h2"));
  box.innerHTML=t("chips").map(c=>`<button type="button" class="chip" data-k="${c.k}" aria-pressed="${c.k===S.chip}">${esc(c.l)}</button>`).join("");
  box.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{S.chip=b.dataset.k;renderChips();refresh(true);}));
  const c=t("chips").find(x=>x.k===S.chip);
  document.getElementById("answer").innerHTML=`<h3>${esc(c.h)}</h3><ul>${c.b.map((x,i)=>{const a=c.a[i]||c.a[0];return `<li><img src="${img(a)}" alt=""><span><b>${NAME[a]}</b> ${esc(x)}</span></li>`}).join("")}</ul>`;}

/* ch3 */
function renderDemo(){
  const tabs=document.getElementById("tabs");
  tabs.innerHTML=["claire","leo","ravi"].map(id=>`<button type="button" class="tab" role="tab" aria-selected="${id===S.tab}" style="--c:var(--c-${id})" data-id="${id}"><img src="${img(id)}" alt="">${NAME[id]}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.id;renderDemo();refresh(true);}));
  document.getElementById("url").textContent="mycarrear.com/"+S.tab;
  const pane=document.getElementById("pane");
  if(S.tab==="claire"){const c=t("claire");
    pane.innerHTML=c.items.map((it,i)=>`<div class="item"><div style="min-width:0"><p><b>${esc(it[1])}</b> (${esc(it[0])}): ${esc(it[2])}</p><small>${esc(it[3])}</small></div><button type="button" class="ok${S.sent.has(i)?" done":""}" data-i="${i}">${esc(S.sent.has(i)?c.used:c.use)}</button></div>`).join("");
    pane.querySelectorAll(".ok").forEach(b=>b.addEventListener("click",()=>{S.sent.add(+b.dataset.i);renderDemo();}));}
  else if(S.tab==="leo"){const c=t("leo");
    pane.innerHTML=`<div class="week">${c.days.map((d,i)=>`<div class="day"><h4>${esc(d)}</h4>${c.ev[i].map(e=>i===3&&S.fixed?`<div class="ev done">${esc(c.booked)} \u2713</div>`:`<div class="ev${i===3?" warn":""}">${esc(e)}</div>`).join("")}</div>`).join("")}</div><div class="alert"><span>${esc(S.fixed?c.fixed:c.alert)}</span>${S.fixed?"":`<button type="button" class="ok" id="fix">${esc(c.fix)}</button>`}</div>`;
    const f=document.getElementById("fix");if(f)f.addEventListener("click",()=>{S.fixed=true;renderDemo();});}
  else{const c=t("ravi");
    pane.innerHTML=`<p style="font-weight:700;margin-top:10px">${esc(c.title)}</p><div class="gantt">${c.rows.map(r=>`<div class="g"><span>${esc(r[0])}</span><div class="track"><i class="${r[1]}" style="left:${r[2]}%;width:${r[3]-r[2]}%"></i></div></div>`).join("")}</div><div class="alert"><span>${esc(S.chased?c.chased:c.today)}</span>${S.chased?"":`<button type="button" class="ok" id="chase">${esc(c.chase)}</button>`}</div>`;
    const cz=document.getElementById("chase");if(cz)cz.addEventListener("click",()=>{S.chased=true;renderDemo();});}
}

/* ch4, ch5 */
function renderVs(){document.getElementById("vs").innerHTML=`<div class="h them">${esc(t("them"))}</div><div class="h us">${esc(t("us"))}</div>`+t("rows").map(r=>`<div class="them">${esc(r[0])}</div><div class="us">${esc(r[1])}</div>`).join("");}
function renderPlan(){document.getElementById("plan").innerHTML=t("steps").map(s=>`<li><div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div></li>`).join("");}

/* ch6 */
function total(){return PRICE.base+(S.sel.pro?PRICE.pro:0)+(S.sel.nina&&S.sel.marco?PRICE.both:(S.sel.nina?PRICE.nina:0)+(S.sel.marco?PRICE.marco:0));}
function renderOpts(){
  const row=(k,title,sub,price,base)=>`<label class="opt${base?" base":""}"><input type="checkbox" data-k="${k}" ${base?"checked disabled":S.sel[k]?"checked":""}><span style="min-width:0"><b>${esc(title)}</b><small>${esc(sub)}</small></span><span class="price">${base?"":"+"}${fmt(price)}</span></label>`;
  document.getElementById("opts").innerHTML=row("base",t("base"),t("baseS"),PRICE.base,true)+row("pro",t("pro"),t("proS"),PRICE.pro)+row("nina",t("nina"),t("ninaS"),PRICE.nina)+row("marco",t("marco"),t("marcoS"),PRICE.marco)+`<p class="fine" id="both">${esc(t("both"))}</p>`;
  document.querySelectorAll("#opts input[data-k]").forEach(i=>i.addEventListener("change",()=>{S.sel[i.dataset.k]=i.checked;sum();refresh(true);}));
  sum();}
function sum(){document.getElementById("total").textContent=fmt(total())+" "+t("month");
  document.getElementById("both").style.visibility=S.sel.nina&&S.sel.marco?"visible":"hidden";
  document.getElementById("planHint").textContent=(S.sel.pro&&S.sel.nina&&S.sel.marco)?t("planMax"):t("planPro");}
/* join flow */
const join=document.getElementById("join"),thanks=document.getElementById("thanks");
const JS={prof:"",lane:"",done:new Set()};
function reqHTML(){return `<h3>${esc(j("reqH"))}</h3><ul>${j("req").map(r=>`<li><span><b>${esc(r[0])}</b> ${esc(r[1])}</span></li>`).join("")}</ul>`;}
function reqShort(){return `<h3>${esc(j("reqH"))}</h3><p class="req-s">${j("req").slice(0,4).map(r=>`<span>✓ ${esc(r[0])}</span>`).join("")}</p>`;}
function renderReq(){document.getElementById("reqBox").innerHTML=reqShort();document.getElementById("reqBox2").innerHTML=reqHTML();}
function joinReady(){const ok=[...document.querySelectorAll("#jChecks input")].every(i=>i.checked)&&JS.prof&&JS.lane&&document.getElementById("jTerms").checked;document.getElementById("jGo").disabled=!ok;}
function renderJoin(){
  document.getElementById("joinH").textContent=j("joinH");
  document.getElementById("jChecks").innerHTML=j("chk").map((c,i)=>`<label><input type="checkbox" data-c="${i}"><span>${esc(c)}</span></label>`).join("");
  document.getElementById("jQ1").textContent=j("q1");document.getElementById("jQ2").textContent=j("q2");
  document.getElementById("jProf").innerHTML=j("prof").map((p,i)=>`<label><input type="radio" name="prof" value="p${i+1}"${JS.prof==="p"+(i+1)?" checked":""}>${esc(p)}</label>`).join("");
  document.getElementById("jLane").innerHTML=j("lane").map((p,i)=>{const v=i?"guided":"express";return `<label><input type="radio" name="lane" value="${v}"${JS.lane===v?" checked":""}>${esc(p)}</label>`}).join("");
  document.getElementById("jSumL").textContent=j("sumL");document.getElementById("jSum").textContent=fmt(total())+" "+t("month");document.getElementById("jSumR").textContent=j("sumR");
  document.getElementById("jPilot").textContent=j("pilot");document.getElementById("jTermsT").textContent=j("terms");document.getElementById("jGoT").textContent=j("go");
  document.getElementById("jDemo").textContent=j("demo");
  join.querySelectorAll("input").forEach(i=>i.addEventListener("change",()=>{if(i.name==="prof")JS.prof=i.value;if(i.name==="lane")JS.lane=i.value;joinReady();}));
  joinReady();}
document.getElementById("go").addEventListener("click",()=>{renderJoin();document.getElementById("jDemo").hidden=true;join.showModal();if(lenis)lenis.stop();});
document.getElementById("joinX").addEventListener("click",()=>join.close());
join.addEventListener("close",()=>{if(lenis)lenis.start();});
document.getElementById("jGo").addEventListener("click",()=>{
  const mods=["pro","nina","marco"].filter(k=>S.sel[k]).join(",");
  const q=new URLSearchParams({profile:JS.prof,lane:JS.lane,modules:mods,lang:L});
  if(CONFIG.startUrl){location.href=CONFIG.startUrl+(CONFIG.startUrl.includes("?")?"&":"?")+q.toString();return;}
  const d=document.getElementById("jDemo");if(d.hidden){d.hidden=false;document.getElementById("jGoT").textContent="→";return;}
  join.close();openThanks("");});
function mask(e){const m=String(e).match(/^([^@]{1,64})@(.+)$/);return m?esc(m[1].charAt(0)+"…@"+m[2]):"";}
function renderThanks(email){
  document.getElementById("tH").textContent=j("thxH");document.getElementById("tAcc").innerHTML=j("thxAcc")(mask(email));
  document.getElementById("tOpen").textContent=j("open");document.getElementById("tKeep").textContent=j("keep");
  const vn=document.getElementById("tVidN");vn.textContent=j("vidN");vn.hidden=!j("vidN");
  document.getElementById("tSteps").innerHTML=j("steps").map((s,i)=>`<li class="${JS.done.has(i)?"ok":""}"><div><b>${esc(s[0])}</b><p>${esc(s[1])}<span class="t-path">${esc(s[2])}</span></p>${i===0?`<div class="t-copy"><code>${esc(CONFIG.marketplace)}</code><button type="button" class="btn sm quiet" data-copy="${esc(CONFIG.marketplace)}">${esc(j("copy"))}</button></div>`:""}<p style="margin-top:8px">${esc(s[3])}</p><div class="t-mini">${i===2?`<button type="button" class="btn sm quiet" data-copy="${esc(j("phrase"))}">${esc(j("copy"))}: ${esc(j("phrase"))}</button>`:""}<button type="button" class="btn sm" data-did="${i}">${esc(j("did"))}</button></div></div></li>`).join("");
  document.getElementById("tHelpT").textContent=j("helpT");
  const h=document.getElementById("tHelp");h.textContent=j("help");h.href=CONFIG.helpWhatsapp||("mailto:"+CONFIG.helpMail+"?subject="+encodeURIComponent("CarrEar · "+j("help")));
  document.getElementById("tBack").textContent=j("back");
  document.querySelectorAll("#tSteps [data-copy]").forEach(b=>b.addEventListener("click",()=>{const v=b.dataset.copy,lab=b.textContent;const ok=()=>{b.textContent=j("copied");setTimeout(()=>b.textContent=lab,1600)};
    if(navigator.clipboard)navigator.clipboard.writeText(v).then(ok,ok);else ok();}));
  document.querySelectorAll("#tSteps [data-did]").forEach(b=>b.addEventListener("click",()=>{JS.done.add(+b.dataset.did);renderThanks(email);}));}
let thxEmail="";
function openThanks(email){thxEmail=email||"";renderThanks(thxEmail);thanks.hidden=false;document.documentElement.style.overflow="hidden";if(lenis)lenis.stop();thanks.scrollTop=0;}
document.getElementById("tBack").addEventListener("click",()=>{thanks.hidden=true;document.documentElement.style.overflow="";document.getElementById("tVid").pause();if(lenis)lenis.start();});
function fromHash(){const h=location.hash||"";if(!h.startsWith("#gracias"))return;const p=new URLSearchParams(h.replace(/^#gracias&?/,"").replace(/^\?/,""));openThanks(p.get("email")||"");}

/* ch7 */
function renderFaq(){document.getElementById("faq").innerHTML=t("faq").map(f=>`<details><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join("");}

/* relay + films */
function renderRelay(){document.getElementById("relay").innerHTML=t("relay").map(([id,x])=>`<li style="--c:var(--c-${id})"><span class="av"><img src="${img(id)}" alt=""></span><p>${esc(x).replace(NAME[id],`<b>${NAME[id]}</b>`)}</p></li>`).join("");}
const film=document.getElementById("film"),filmV=document.getElementById("filmV");
function openFilm(src,at){filmV.src=src;film.showModal();if(lenis)lenis.stop();filmV.addEventListener("loadedmetadata",()=>{filmV.currentTime=at||0;},{once:true});filmV.play().catch(()=>{});}
const heroV=document.getElementById("heroV"),heroPlay=document.getElementById("heroPlay");
heroPlay.addEventListener("click",()=>{heroV.controls=true;heroPlay.hidden=true;heroV.currentTime=0;heroV.play().catch(()=>{});});
heroV.addEventListener("ended",()=>{heroV.controls=false;heroPlay.hidden=false;});
const hfScene=document.querySelector(".hf-scene");heroV.addEventListener("play",()=>hfScene.classList.add("playing"));["pause","ended"].forEach(ev=>heroV.addEventListener(ev,()=>hfScene.classList.remove("playing")));
document.getElementById("filmX").addEventListener("click",()=>film.close());
film.addEventListener("click",e=>{if(e.target===film)film.close();});
film.addEventListener("close",()=>{filmV.pause();if(lenis)lenis.start();});

/* meet your agents */
const meet=document.getElementById("meet"),MORDER=["nina","marco","helena","maya","leo","ravi","claire"];const AV={claire:50,leo:47,helena:50,maya:72,nina:51,marco:49};let mA="film";
function renderMeet(){const M=t("agents"),a=M[mA],tabs=document.getElementById("mTabs"),body=document.getElementById("mBody");
  const old=body.querySelector("video");if(old)old.pause();
  tabs.innerHTML=`<button type="button" class="m-tab film" role="tab" aria-selected="${mA==="film"}" data-id="film">&#9654; ${esc(t("teamFilm"))}</button>`+MORDER.map(id=>`<button type="button" class="m-tab" role="tab" aria-selected="${id===mA}" style="--c:var(--c-${id})" data-id="${id}"><img src="${img(id)}" alt="">${NAME[id]}</button>`).join("");
  tabs.querySelectorAll(".m-tab").forEach(b=>b.addEventListener("click",()=>{mA=b.dataset.id;renderMeet();body.scrollTop=0;}));
  if(mA==="film"){body.innerHTML=`<div class="m-film"><img src="img/team.jpg" alt=""><button type="button" class="bigplay" aria-label="${esc(t("pl"))}: ${esc(t("teamFilm"))}"><span aria-hidden="true">&#9654;</span><b>${esc(t("teamFilm"))}</b></button></div>`;
    body.querySelector(".bigplay").addEventListener("click",()=>playIn(body.querySelector(".m-film"),"video/meet-your-team.mp4"));return;}
  body.style.setProperty("--c",`var(--c-${mA})`);
  body.innerHTML=`<div class="m-photo" style="--op:${AV[mA]||50}%"><img src="${img(mA)}" alt="${NAME[mA]}">${AV[mA]!=null?`<button type="button" class="bigplay" aria-label="${esc(t("pl"))}: ${NAME[mA]}"><span aria-hidden="true">&#9654;</span><b>${NAME[mA]}</b></button>`:""}</div><div class="m-txt"><p class="m-role">${esc(a.role)}</p><h3 class="m-name">${NAME[mA]}</h3><p class="m-words">${esc(a.w)}</p><div class="m-sec"><h4>${esc(t("mDoes"))}</h4><ul class="m-list">${a.f.map(x=>`<li><span>${esc(x)}</span></li>`).join("")}</ul></div><div class="m-sec"><h4>${esc(t("mCases"))}</h4><div class="m-cases">${a.u.map(x=>`<p class="m-case">${esc(x)}</p>`).join("")}</div></div></div>`;
  const bp=body.querySelector(".m-photo .bigplay");if(bp)bp.addEventListener("click",()=>playIn(body.querySelector(".m-photo"),`video/agents/${mA}.mp4`));}
function playIn(box,src,at){box.classList.add("playing");box.innerHTML=`<video controls playsinline autoplay src="${src}"></video>`;const v=box.querySelector("video");
  if(at!=null)v.addEventListener("loadedmetadata",()=>{v.currentTime=at;},{once:true});v.play().catch(()=>{});return v;}
function openMeet(tab,at){mA=tab;renderMeet();meet.showModal();if(lenis)lenis.stop();if(tab==="film"&&at!=null)playIn(document.querySelector("#mBody .m-film"),"video/meet-your-team.mp4",at);}
document.getElementById("meetBtn").addEventListener("click",()=>openMeet("film"));
document.getElementById("relayFilm").addEventListener("click",()=>openMeet("film",50));
document.getElementById("meetX").addEventListener("click",()=>meet.close());
meet.addEventListener("click",e=>{if(e.target===meet)meet.close();});
meet.addEventListener("close",()=>{const v=document.querySelector("#mBody video");if(v)v.pause();if(lenis)lenis.start();});

function apply(){
  document.documentElement.lang=L;
  document.title=T[L].bmy+" CarrEar · "+T[L].btag;
  const mk=document.querySelector(".mark");if(mk)mk.setAttribute("aria-label",T[L].bmy+" CarrEar, "+T[L].btag);
  document.querySelectorAll("[data-i]").forEach(el=>{const v=T[L][el.dataset.i];if(typeof v==="string")el.textContent=v;});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===L));
  renderNav();renderSeps();renderChips();renderDemo();renderVs();renderPlan();renderOpts();renderFaq();renderRelay();renderMeet();renderReq();if(join.open)renderJoin();if(!thanks.hidden)renderThanks(thxEmail);measure();refresh();update();
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{L=b.dataset.l;try{localStorage.setItem("mct-lang",L)}catch(e){}apply();}));
apply();
fromHash();addEventListener("hashchange",fromHash);
})();
</script>
